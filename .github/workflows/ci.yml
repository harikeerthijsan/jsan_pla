name: CI

# Runs on every PR and on pushes to the deploy branches. Railway "Wait for CI" holds the
# staging/production deployment until every workflow on the pushed commit succeeds, so the
# push trigger for staging and main is required. No repository secrets are used anywhere.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel deploy-branch runs: a cancelled run can block Railway's Wait for CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never talks to Railway, Postgres or a bucket. These make any accidental use fail closed.
  APP_ENV: development
  DATABASE_URL: sqlite:///./ci_pla_qc.db
  STORAGE_MODE: local
  LOCAL_STORAGE_ROOT: ./ci-storage

jobs:
  test:
    name: Python and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q api/app api/worker.py api/railway_entrypoint.py api/migrations
      - name: API tests (includes production guard, health and release-config tests)
        run: python -m pytest -q
        working-directory: api
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/assets/app.js
      - name: Feature modules
        shell: bash
        run: for f in web/assets/modules/*.js; do node --check "$f"; done
      - run: node --check web/config.js

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/check_repo_hygiene.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  image-app:
    # The root Dockerfile is the image Railway deploys as service pla-qc (UI + API + worker).
    name: Railway app image (root Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: jsan-pla-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Native geospatial stack
        run: |
          docker run --rm jsan-pla-app:ci pdal --version
          docker run --rm jsan-pla-app:ci gdalinfo --version
          docker run --rm jsan-pla-app:ci python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 38, 0); print(sqlite3.sqlite_version)"
      - name: Container serves /health/live and /health/ready
        run: |
          docker run -d --name pla-smoke -p 8000:8000 \
            -e APP_ENV=development -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e STORAGE_MODE=local -e LOCAL_STORAGE_ROOT=/tmp/storage \
            jsan-pla-app:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/health/ready | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8000/ | grep -q 'PLA Quality Validation Workbench'
      - name: Smoke container logs
        if: always()
        run: docker logs pla-smoke || true
      - name: Production guard refuses unsafe configuration inside the image
        run: |
          set +e
          timeout 120 docker run --rm \
            -e APP_ENV=production -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e STORAGE_MODE=local -e ADMIN_EMAIL=ci@example.invalid \
            -e ADMIN_PASSWORD=ci-only-placeholder-value \
            -e JWT_SECRET=ci-only-placeholder-value-that-is-long-enough \
            jsan-pla-app:ci > guard.log 2>&1
          code=$?
          set -e
          cat guard.log
          test "$code" -ne 0 -a "$code" -ne 124
          grep -q 'Unsafe production configuration' guard.log
      - name: Scan app image for fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jsan-pla-app:ci
          format: json
          output: trivy-app.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Enforce app vulnerability gate
        run: python scripts/ci/check_trivy_report.py trivy-app.json --source Dockerfile

  image-worker:
    name: Worker image (worker/Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: false
          load: true
          tags: jsan-pla-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Worker imports and native stack
        run: |
          docker run --rm jsan-pla-worker:ci pdal --version
          docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db jsan-pla-worker:ci python -c "import app.processor, app.ingest, app.sections; print('worker imports ok')"
      - name: Scan worker image for fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jsan-pla-worker:ci
          format: json
          output: trivy-worker.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Enforce worker vulnerability gate
        run: python scripts/ci/check_trivy_report.py trivy-worker.json --source worker/Dockerfile
